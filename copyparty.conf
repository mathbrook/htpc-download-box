# copyparty configuration file
# not actually YAML but lets pretend:
# -*- mode: yaml -*-
# vim: ft=yaml:

[global]
  e2dsa  # enable file indexing and filesystem scanning
  e2ts   # enable multimedia indexing (tags, thumbnails, etc.)
  ansi   # enable colors in log messages
  ver    # show copyparty version in the control panel

  # store thumbnails and index in config folder instead of each volume
  hist: /cfg/hists/

  # enable version-checking to show warnings about vulnerabilities
  vc-url: https://api.github.com/repos/9001/copyparty/security-advisories?per_page=9

  # uncomment to restrict to LAN access only:
  # ipa: lan

[accounts]
  # Change these credentials after first login!
  # Format: username: password
  admin: changeme123

  # You can add more read-only users like:
  # viewer: viewpass

[/movies]
  /w/movies
  accs:
    r: *           # everyone gets read access
    rwmda: admin   # admin gets full access (read-write-move-delete-admin)
  flags:
    e2ds           # enable filesystem scanning for this volume

[/tv]
  /w/tv
  accs:
    r: *
    rwmda: admin
  flags:
    e2ds

[/music]
  /w/music
  accs:
    r: *
    rwmda: admin
  flags:
    e2ds, e2ts     # enable both filesystem and multimedia indexing for music

[/comics]
  /w/comics
  accs:
    r: *
    rwmda: admin
  flags:
    e2ds

services:
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - net_admin # required to modify network interfaces
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /dev/net:/dev/net:z # tun device
    ports:
      - 8080:8080 #qbittorrent frontend port hopefully
      - 8945:8945 # yt downloader
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: service:vpn # run on the vpn network
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${ROOT}/downloads:/downloads # downloads folder
      - ${ROOT}/config/qBittorrent:/config # config files

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT}/config/prowlarr:/config
    ports:
      - 9696:9696
    restart: always


  jackett:
    container_name: jackett
    image: linuxserver/jackett:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
#       - ${ROOT}/downloads/torrent-blackhole:/downloads # place where to put .torrent files for manual download
#
      - ${ROOT}/config/jackett:/config # config files

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT}/config/sonarr:/config # config files
      - ${ROOT}/media/tv:/tv # tv shows folder
      - ${ROOT}/downloads:/downloads # download folder
# 
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT}/config/radarr:/config # config files
      - ${ROOT}/media/movies:/movies # movies folder
      - ${ROOT}/downloads:/downloads # download folder
# 
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    cap_add:
      - net_admin
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    network_mode: host
    volumes:
      - ${ROOT}/media/tv:/data/tvshows
      - ${ROOT}/config/jellyfin/library:/config
      - ${ROOT}/media/movies:/data/movies
      - ${ROOT}/pinchflat/downloads:/data/youtube_archive
    # ports:
      # - 8096:8096
      # - 8920:8920 #optional
      # - 7359:7359/udp #optional
      # - 1900:1900/udp #optional
    restart: always
# 
  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
      - UMASK_SET=022 #optional
    volumes:
      - ${ROOT}/config/bazarr:/config # config files
      - ${ROOT}/media/movies:/movies # movies folder
      - ${ROOT}/media/tv:/tv # tv shows folder
      
  mylar3:
    container_name: mylar3
    image: linuxserver/mylar3:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT}/config/mylar3:/config
      - ${ROOT}/downloads:/downloads
      - ${ROOT}/media/comics:/comics

  komga:
    container_name: komga
    image: gotson/komga:latest
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT}/config/komga:/config
      - ${ROOT}/media/comics:/books
    restart: always

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    # network_mode: host
    logging:
        driver: "json-file"
        options:
            max-size: "100m"
            max-file: "5"
    environment:
      - TZ=${TZ}
      # - PUID=${PUID}
      # - PGID=${PGID}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
    ports:
      - 7575:7575
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ${ROOT}/config/homarr/appdata:/appdata
    restart: always

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # environment:
      # - PORT=8083
    ports:
      - 8083:8080
    restart: always

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${ROOT}/config/jellyseerr:/app/config
    restart: always

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    ports:
      - "${PORT:-8191}:8191"
    restart: always
    
  # youtube-downloader:
  #   image: ghcr.io/kieraneglin/pinchflat:latest
  #   container_name: youtube-downloader-pinchflat
  #   network_mode: service:vpn
  #   environment:
  #     # Set the timezone to your local timezone
  #     - TZ=America/New_York
  #   # ports:
  #     # - '8945:8945'
  #   volumes:
  #     - ${ROOT}/pinchflat/config:/config
  #     - ${ROOT}/pinchflat/downloads:/downloads
      
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    network_mode: host
    container_name: lidarr
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ROOT}/lidarr/config:/config
      - ${ROOT}/music:/music #optional
      - ${ROOT}/downloads:/downloads #optional
    # ports:
      # - 8686:8686
    restart: unless-stopped

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    networks:
      - gitea
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - USER_UID=${GITUID}
      - USER_GID=${GITGID}
    restart: always
    volumes:
      - ${ROOT}/gitea:/data
      - /home/git/.ssh/:/data/git/.ssh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3001:3000
      - 2222:22

  # soulseek:
  #   image: realies/soulseek
  #   container_name: soulseek
  #   restart: unless-stopped
  #   volumes:
  #     - ${ROOT}/soulseek/appdata:/data/.SoulseekQt
  #     - ${ROOT}/soulseek/downloads:/data/Soulseek Downloads
  #     - ${ROOT}/soulseek/logs:/data/Soulseek Chat Logs
  #     - ${ROOT}/soulseek/shared:/data/Soulseek Shared Folder
  #   environment:
  #     - PGID=1000
  #     - PUID=1000
  #   ports:
  #     - 6080:6080
  #     - 61122:61122 # example listening port, check Options -> Login
  #     - 61123:61123 # example obfuscated port, check Options -> Login

  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    ports:
      - 3923:3923
    volumes:
      - ./copyparty.conf:/cfg/copyparty.conf:ro # Config file from repo
      - ${ROOT}/media/movies:/w/movies:ro # Movies folder (read-only)
      - ${ROOT}/media/tv:/w/tv:ro # TV shows folder (read-only)
      - ${ROOT}/music:/w/music:ro # Music folder (read-only)
      - ${ROOT}/media/comics:/w/comics:ro # Comics folder (read-only)
    environment:
      - TZ=${TZ}
      - PYTHONUNBUFFERED=1

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      - REPO_URL=https://github.com/mathbrook/htpc-download-box
      - RUNNER_NAME=homelab-runner
      - RUNNER_WORKDIR=/tmp/runner/work
      - RUNNER_SCOPE=repo
      - LABELS=self-hosted,linux,docker
      - ACCESS_TOKEN=${GITHUB_PAT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/dev/htpc-download-box:/home/ubuntu/dev/htpc-download-box
      - ${ROOT}:${ROOT}

  # owntracks-recorder:
  #   image: owntracks/recorder:latest
  #   container_name: owntracks-recorder
  #   restart: always
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - OTR_HOST=mqtt_broker
  #   ports:
  #     - 8087:8083
  #   volumes:
  #     - ${ROOT}/owntracks/recorder_store:/store


networks:
  gitea:
    external: false
